name: Inkweld
version: "0.1.0-dev.2"
slug: inkweld
description: Collaborative writing and worldbuilding in your Home Assistant sidebar
url: https://github.com/bobbyquantum/inkweld
arch:
  - aarch64
  - amd64

# The UI is served through Home Assistant ingress: HA signs people in and
# Inkweld maps each HA user to an Inkweld account.
ingress: true
ingress_port: 8333
ingress_stream: true
panel_icon: mdi:fountain-pen-tip
panel_title: Inkweld
# Household members who are not HA admins can write too.
panel_admin: false

# Optional direct port for the Inkweld desktop/mobile apps and MCP clients,
# which can't use ingress. Off until a host port is set in the app's Network
# settings; accounts reached this way sign in with a passkey or password.
ports:
  8333/tcp: null
ports_description:
  8333/tcp: Direct access for Inkweld desktop/mobile apps and MCP clients

# SQLite and LevelDB files aren't safe to copy while they're being written.
backup: cold

options:
  admins: []
  allowed_origins: []
  webauthn_rp_id: ""
  log_level: info
schema:
  admins:
    - str
  allowed_origins:
    - url
  webauthn_rp_id: str?
  log_level: list(debug|info|warn|error)
